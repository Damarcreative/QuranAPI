<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Quran API | DamarCreative</title>

    <meta name="description"
        content="Discover the Quran API of Damar Jati. A collection of UI/UX design and Front-End development projects, featuring LUI, Color Picker, and more.">
    <meta name="keywords"
        content="Quran API, Quran, API, Quran API, Quran API, Quran API, Quran API, Quran API, Quran API, Quran API">
    <meta name="author" content="Damar Jati">
    <meta name="robots" content="index, follow">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://damarcreative.com/projects.html">
    <meta property="og:title" content="Quran API | DamarCreative">
    <meta property="og:description"
        content="Quran API, a high-performance, open-source Quran API built for developers. Fast, reliable, and free for the Ummah.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Quran API | DamarCreative">
    <meta name="twitter:description"
        content="Quran API, a high-performance, open-source Quran API built for developers. Fast, reliable, and free for the Ummah.">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <div class="page-wrapper">
        <header>
            <a href="index.html" class="logo-wrapper">
                <div class="logo-circle"></div>
                <span class="logo-text">DamarCreative</span>
            </a>
            <button class="menu-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="quran.html" class="nav-link active">Quran</a>
                <a href="docs.html" class="nav-link">API Docs</a>
            </nav>
            <div class="header-location">
                <div><span class="location-text">City, Province</span> <span id="clock" class="clock">--:--</span></div>
                <div class="country">Country</div>
            </div>
        </header>

        <main class="page-content">
            <h1 class="page-title">
                <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204.21 204.21">
                    <g fill="currentColor">
                        <rect x="82.1" width="40" height="204.21" />
                        <rect x="82.1" y="0" width="40" height="204.21"
                            transform="translate(-42.29 102.1) rotate(-45)" />
                        <rect x="0" y="82.1" width="204.21" height="40" />
                        <rect x="0" y="82.1" width="204.21" height="40"
                            transform="translate(-42.29 102.1) rotate(-45)" />
                    </g>
                </svg>QURAN<span class="accent">.</span>
            </h1>

            <!-- Quran App Container -->
            <div id="quran-app">
                <!-- Top Controls -->
                <div class="quran-controls" style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="search-box" style="flex: 1;">
                        <input type="text" id="search-surah" class="form-input" placeholder="Search Surah...">
                    </div>
                </div>

                <!-- View: Surah List -->
                <div id="surah-list-view" class="resource-grid">
                    <!-- Surah cards will be injected here -->
                    <div class="loader">Loading Quran Data...</div>
                </div>

                <!-- View: Reader -->
                <div id="reader-view" style="display: none;">
                    <div class="reader-header"
                        style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 2rem;">
                        <button id="btn-back" class="btn-primary"
                            style="padding: 0.5rem 0.5rem; font-size: 0.8rem; border: none; border-radius: 0;">&larr;
                            Back</button>
                        <div class="reader-settings" style="display: flex; gap: 1rem; align-items: center;">
                            <label
                                style="color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" id="toggle-translation" checked
                                    style="accent-color: var(--accent-green);">
                                Show Translation
                            </label>
                            <select id="select-edition" class="form-input"
                                style="width: auto; padding: 0.5rem; background: var(--bg-color);">
                                <option value="id-indonesian">Indonesian</option>
                                <option value="en-sahih">English (Sahih)</option>
                                <option value="ar-jalalayn">Tafsir Jalalayn</option>
                            </select>
                        </div>
                    </div>

                    <div id="surah-header" style="text-align: center; margin-bottom: 3rem;">
                        <h2 id="current-surah-name" style="font-size: 2rem; color: var(--accent-green);"></h2>
                        <p id="current-surah-info" style="color: var(--text-muted);"></p>
                    </div>

                    <div id="ayah-container" class="ayah-list">
                        <!-- Ayahs will be injected here -->
                    </div>

                    <div class="reader-footer" style="margin-top: 3rem; display: flex; justify-content: space-between;">
                        <button id="btn-prev-surah" class="btn-primary" style="display: none;">Previous Surah</button>
                        <button id="btn-next-surah" class="btn-primary" style="display: none;">Next Surah</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <footer id="footer-marquee"></footer>

    <!-- Templates -->
    <template id="tpl-surah-card">
        <a href="#" class="resource-card">
            <div class="resource-meta">
                <span class="surah-number" style="color: var(--accent-green); font-weight: bold;"></span>
                <span class="surah-verses"></span>
            </div>
            <h3 class="surah-name-en"></h3>
            <p class="surah-name-ar"
                style="font-family: 'Amiri', serif; font-size: 1.2rem; margin-top: 0.5rem; color: var(--text-color);">
            </p>
            <div class="resource-tags">
                <span class="surah-type resource-tag"></span>
            </div>
        </a>
    </template>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script src="scripts.js"></script>
</body>

</html>
